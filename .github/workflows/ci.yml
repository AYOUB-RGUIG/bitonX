name: BitonX CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  python:
    name: Python foundation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - backend
          - ai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install -e "${{ matrix.project }}[dev]"

      - name: Compile
        run: python -m compileall "${{ matrix.project }}"

      - name: Lint
        run: python -m ruff check "${{ matrix.project }}"

      - name: Test
        run: python -m pytest "${{ matrix.project }}/tests"

  frontend:
    name: Frontend foundation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  docker:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config
